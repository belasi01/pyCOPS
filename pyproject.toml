[project]
name = "pycops"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "xarray>=2024.6",
    "netCDF4>=1.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35", "matplotlib>=3.8"]

[project.scripts]
pycops-clean = "pycops.ui.clean_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pycops"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
